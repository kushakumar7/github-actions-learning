name: GitHub Actions Event Trigger Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Event Trigger Demo
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Identify Trigger
        run: echo "GitHub Actions workflow started"

      - name: Step 2 - Display Event Name
        run: 'echo "Event: ${{ github.event_name }}"'

      - name: Step 3 - Display Branch
        run: 'echo "Branch: ${{ github.ref_name }}"'

      - name: Step 4 - Build Message
        run: echo "Application build completed successfully"
